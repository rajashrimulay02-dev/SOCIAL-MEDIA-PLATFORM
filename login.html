<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login / Register</title><link rel="stylesheet" href="style.css"></head>
<body>
<header id="nav"></header>
<main>
  <div class="box narrow">
    <h2 id="title">Login</h2>
    <div id="msg"></div>
    <div id="regFields" style="display:none">
      <label>Full Name</label><input id="name">
      <label>Username</label><input id="username" placeholder="e.g. komal_01">
    </div>
    <label>Email</label><input id="email" type="email">
    <label>Password</label><input id="password" type="password">
    <button class="btn" id="submitBtn" onclick="submitForm()">Login</button>
    <p style="margin-top:14px"><a href="#" id="toggle" onclick="toggleMode()">New user? Register here</a></p>
  </div>
</main>
<script src="app.js"></script>
<script>
let isRegister = false;
function toggleMode() {
  isRegister = !isRegister;
  title.textContent = isRegister ? 'Register' : 'Login';
  submitBtn.textContent = isRegister ? 'Register' : 'Login';
  regFields.style.display = isRegister ? 'block' : 'none';
  toggle.textContent = isRegister ? 'Already have an account? Login' : 'New user? Register here';
}
async function submitForm() {
  const body = { email: email.value, password: password.value };
  if (isRegister) { body.name = name.value; body.username = username.value; }
  try {
    await api(isRegister ? '/api/register' : '/api/login', 'POST', body);
    location.href = '/';
  } catch (e) { msg.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
}
</script>
</body></html>
