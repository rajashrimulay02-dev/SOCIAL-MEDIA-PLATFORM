<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniSocial - Home</title><link rel="stylesheet" href="style.css"></head>
<body>
<header id="nav"></header>
<main>
  <div class="box" id="newPost" style="display:none">
    <textarea id="content" rows="3" maxlength="280" placeholder="What's on your mind?"></textarea>
    <button class="btn" onclick="createPost()">Post</button>
  </div>
  <div class="tabs">
    <button id="tabAll" class="active" onclick="setFeed('all')">All Posts</button>
    <button id="tabFollowing" onclick="setFeed('following')">Following</button>
  </div>
  <div id="feed">Loading...</div>
  <div class="box" id="people" style="display:none"><h3>👥 People to follow</h3><div id="peopleList"></div></div>
</main>
<script src="app.js"></script>
<script>
let feed = 'all';

async function init() {
  await renderNav();
  if (ME) { newPost.style.display = 'block'; loadPeople(); }
  loadFeed();
}

function setFeed(f) {
  if (f === 'following' && !ME) { location.href = '/login.html'; return; }
  feed = f;
  tabAll.className = f === 'all' ? 'active' : '';
  tabFollowing.className = f === 'following' ? 'active' : '';
  loadFeed();
}

async function loadFeed() {
  const posts = await api('/api/posts?feed=' + feed);
  document.getElementById('feed').innerHTML = posts.length
    ? posts.map(postHTML).join('')
    : '<div class="box">No posts yet. ' + (feed === 'following' ? 'Follow some people!' : 'Be the first to post!') + '</div>';
}

async function createPost() {
  try {
    await api('/api/posts', 'POST', { content: content.value });
    content.value = '';
    loadFeed();
  } catch (e) { alert(e.message); }
}

async function loadPeople() {
  const users = await api('/api/users');
  if (!users.length) return;
  people.style.display = 'block';
  peopleList.innerHTML = users.map(u =>
    `<div class="user-row"><a href="/profile.html?id=${u.id}">${esc(u.name)} <small>@${esc(u.username)}</small></a>
     <button class="btn outline" onclick="followFromList(${u.id}, this)">Follow</button></div>`).join('');
}

async function followFromList(id, btn) {
  try {
    const r = await api(`/api/users/${id}/follow`, 'POST');
    btn.textContent = r.isFollowing ? 'Following ✓' : 'Follow';
    if (feed === 'following') loadFeed();
  } catch (e) { alert(e.message); }
}

init();
</script>
</body></html>
